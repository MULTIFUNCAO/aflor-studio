<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Portal do Aluno — Flora</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ivory:#FAF8F4; --paper:#FFFFFF; --ink:#17160F;
  --line:rgba(23,22,15,.07); --line-soft:rgba(23,22,15,.045);
  --shadow-xs:0 1px 2px rgba(23,22,15,.04);
  --shadow-sm:0 4px 16px -8px rgba(23,22,15,.10);
  --shadow-md:0 16px 40px -20px rgba(23,22,15,.18);
  --radius-lg:18px; --radius-md:14px; --radius-sm:10px;
  --font-flora:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-400:#94a3b8; --gray-600:#475569;
  --green:#15803d; --purple:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-flora);background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
.screen{display:none}
.screen.active{display:block}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--paper);border-radius:var(--radius-lg);padding:36px 28px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .icon{width:56px;height:56px;background:linear-gradient(135deg,#7c3aed,#059669);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.login-logo .brand{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#7c3aed,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo .sub{font-size:12px;color:var(--gray-600);margin-top:2px}
.field{margin-bottom:12px}
.field label{font-size:11px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:14px;outline:none;background:var(--gray-50)}
.field input:focus{border-color:#7c3aed;background:var(--paper)}
.btn-main{width:100%;padding:13px;background:#111;color:#fff;border:none;border-radius:999px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-main:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{width:100%;padding:11px;background:var(--paper);color:#333;border:1.5px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer}
.alert-box{border-radius:10px;padding:10px 13px;font-size:12.5px;font-weight:600;margin-bottom:12px;display:none}
.alert-box.err{display:block;background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.alert-box.ok{display:block;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}

/* ===== App ===== */
.topbar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.topbar-title{font-size:16px;font-weight:800}
.topbar-sair{background:none;border:none;color:#888;font-size:12px;cursor:pointer;font-weight:600}
.content{padding:16px;max-width:640px;margin:0 auto 80px}
.saudacao{font-size:19px;font-weight:800;margin-bottom:4px}
.saudacao-sub{font-size:13px;color:var(--gray-600);margin-bottom:18px}

.curso-card{background:var(--paper);border-radius:var(--radius-md);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-xs);cursor:pointer;border:1px solid var(--line-soft)}
.curso-card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.curso-card-capa{width:48px;height:48px;border-radius:10px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;object-fit:cover}
.curso-card-nome{font-weight:700;font-size:14.5px}
.curso-card-status{font-size:11.5px;color:var(--gray-600);margin-top:2px}
.progress-track{background:var(--gray-100);border-radius:20px;height:8px;overflow:hidden}
.progress-fill{background:var(--green);height:100%;border-radius:20px;transition:width .3s}
.progress-label{font-size:11px;color:var(--gray-600);margin-top:5px;text-align:right}

.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.badge-green{background:#dcfce7;color:#15803d}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-gray{background:#f1f5f9;color:#555}
.badge-yellow{background:#fef3c7;color:#92400e}

.back-btn{background:none;border:none;color:#888;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.modulo-block{border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:12px;overflow:hidden}
.modulo-head{background:var(--gray-50);padding:11px 14px;font-weight:700;font-size:13.5px}
.item-row{display:flex;align-items:center;padding:11px 14px;border-top:1px solid var(--line-soft);font-size:13px;cursor:pointer}
.item-row:active{background:var(--gray-50)}
.item-icon{margin-right:10px;font-size:15px}
.item-check{margin-left:auto;font-size:16px}

.item-viewer{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;flex-direction:column}
.item-viewer.open{display:flex}
.item-viewer-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.item-viewer-body{flex:1;overflow-y:auto;padding:18px 16px}
.item-viewer video, .item-viewer iframe{width:100%;border-radius:var(--radius-sm);border:none}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 12px rgba(0,0,0,.04)}
.bottom-nav button{flex:1;background:none;border:none;padding:10px 0 8px;font-size:10.5px;color:var(--gray-400);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.bottom-nav button.active{color:var(--ink)}
.bottom-nav button .ic{font-size:19px}

.empty-state{text-align:center;padding:40px 20px;color:var(--gray-400);font-size:13px}
.spinner-inline{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="screen-login">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">
          <svg width="28" height="32" viewBox="0 0 100 115" fill="none">
            <path d="M50 62 C50 62 26 53 20 30 C14 8 36 2 50 24 C64 2 86 8 80 30 C74 53 50 62 50 62Z" fill="white" opacity="0.92"/>
            <path d="M50 62 L50 102" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand">FLORA</div>
        <div class="sub">Portal do Aluno</div>
      </div>
      <div class="alert-box" id="login-alert"></div>
      <div class="field"><label>E-mail</label><input id="login-email" type="email" placeholder="seu@email.com" autocomplete="email"/></div>
      <div class="field"><label>Senha</label><div style="position:relative">
        <input id="login-senha" type="password" placeholder="Sua senha" autocomplete="current-password" style="padding-right:38px"/>
        <span onclick="toggleSenhaVisivel('login-senha',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:15px;color:#888;user-select:none">👁</span>
      </div></div>
      <button class="btn-main" id="btn-login" onclick="fazerLoginAluno()">Entrar</button>
      <div style="text-align:center;margin-top:12px">
        <button type="button" onclick="mostrarRecuperarSenha()" style="background:none;border:none;color:var(--gray-600);font-size:12.5px;cursor:pointer;text-decoration:underline">Esqueci minha senha</button>
      </div>
    </div>
  </div>
</div>

<!-- RECUPERAR SENHA -->
<div class="screen" id="screen-recuperar">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">
          <svg width="28" height="32" viewBox="0 0 100 115" fill="none">
            <path d="M50 62 C50 62 26 53 20 30 C14 8 36 2 50 24 C64 2 86 8 80 30 C74 53 50 62 50 62Z" fill="white" opacity="0.92"/>
            <path d="M50 62 L50 102" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand">FLORA</div>
        <div class="sub">Recuperar senha</div>
      </div>
      <div class="alert-box" id="recuperar-alert"></div>
      <div class="field"><label>E-mail cadastrado</label><input id="recuperar-email" type="email" placeholder="seu@email.com" autocomplete="email"/></div>
      <button class="btn-main" id="btn-recuperar" onclick="enviarRecuperarSenha()">Enviar link de recuperação</button>
      <button type="button" class="btn-outline" style="margin-top:10px" onclick="voltarParaLogin()">← Voltar pro login</button>
    </div>
  </div>
</div>

<!-- DEFINIR NOVA SENHA (chegou aqui pelo link do e-mail) -->
<div class="screen" id="screen-nova-senha">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">
          <svg width="28" height="32" viewBox="0 0 100 115" fill="none">
            <path d="M50 62 C50 62 26 53 20 30 C14 8 36 2 50 24 C64 2 86 8 80 30 C74 53 50 62 50 62Z" fill="white" opacity="0.92"/>
            <path d="M50 62 L50 102" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand">FLORA</div>
        <div class="sub">Defina sua nova senha</div>
      </div>
      <div class="alert-box" id="nova-senha-alert"></div>
      <div class="field"><label>Nova senha</label><div style="position:relative">
        <input id="nova-senha-1" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" style="padding-right:38px"/>
        <span onclick="toggleSenhaVisivel('nova-senha-1',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:15px;color:#888;user-select:none">👁</span>
      </div></div>
      <div class="field"><label>Confirme a nova senha</label><div style="position:relative">
        <input id="nova-senha-2" type="password" placeholder="Repita a senha" autocomplete="new-password" style="padding-right:38px"/>
        <span onclick="toggleSenhaVisivel('nova-senha-2',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:15px;color:#888;user-select:none">👁</span>
      </div></div>
      <button class="btn-main" id="btn-nova-senha" onclick="salvarNovaSenha()">Salvar nova senha</button>
    </div>
  </div>
</div>

<!-- APP -->
<div class="screen" id="screen-app">
  <div class="topbar">
    <div class="topbar-title" id="topbar-titulo">Meus Cursos</div>
    <button class="topbar-sair" onclick="sairAluno()">Sair</button>
  </div>

  <div class="content" id="view-cursos">
    <div class="saudacao" id="saudacao-aluno">Olá! 🌷</div>
    <div class="saudacao-sub">Seus cursos e progresso</div>
    <div id="lista-cursos-aluno"><div class="empty-state">Carregando...</div></div>
  </div>

  <div class="content" id="view-curso-detalhe" style="display:none">
    <button class="back-btn" onclick="mostrarView('cursos')">← Meus Cursos</button>
    <div id="curso-detalhe-corpo"></div>
  </div>

  <div class="content" id="view-turma" style="display:none">
    <div class="saudacao" style="font-size:16px">📅 Minha Turma</div>
    <div id="turma-aluno-corpo" style="margin-top:14px"><div class="empty-state">Carregando...</div></div>
  </div>

  <div class="content" id="view-certificados" style="display:none">
    <div class="saudacao" style="font-size:16px">🎓 Certificados</div>
    <div id="certificados-aluno-corpo" style="margin-top:14px"><div class="empty-state">Carregando...</div></div>
  </div>

  <div class="content" id="view-avisos" style="display:none">
    <div class="saudacao" style="font-size:16px">🔔 Avisos</div>
    <div id="avisos-aluno-corpo" style="margin-top:14px"><div class="empty-state">Carregando...</div></div>
  </div>

  <div class="bottom-nav">
    <button id="nav-cursos" onclick="mostrarView('cursos')"><span class="ic">📚</span>Cursos</button>
    <button id="nav-turma" onclick="mostrarView('turma')"><span class="ic">📅</span>Turma</button>
    <button id="nav-avisos" onclick="mostrarView('avisos')" style="position:relative"><span class="ic">🔔</span>Avisos<span id="avisos-badge" style="display:none;position:absolute;top:4px;right:calc(50% - 22px);background:#ef4444;color:#fff;border-radius:999px;font-size:9px;font-weight:800;min-width:15px;height:15px;line-height:15px;text-align:center;padding:0 2px"></span></button>
    <button id="nav-certificados" onclick="mostrarView('certificados')"><span class="ic">🎓</span>Certificados</button>
  </div>
</div>

<!-- Visualizador de conteúdo (aula / material) -->
<div class="item-viewer" id="item-viewer">
  <div class="item-viewer-head">
    <div style="font-weight:700;font-size:14px" id="item-viewer-titulo">Conteúdo</div>
    <button onclick="fecharViewer()" style="background:none;border:none;font-size:20px;color:#888;cursor:pointer">✕</button>
  </div>
  <div class="item-viewer-body" id="item-viewer-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://nqwzbpinhkgxfboeursu.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3picGluaGtneGZib2V1cnN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTE2MTMsImV4cCI6MjA5NTcyNzYxM30.ASni8j7rfDxjhWYrDxbwidacJaV51eDzzY7XbdGQCEk';
// storageKey isolado — evita colidir com a sessão do dono do salão (index.html)
// caso os dois estejam abertos no mesmo navegador.
const supa = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: 'flora-aluno-auth' } });

let alunoAtual = null;         // linha de curso_alunos
let matriculasAtuais = [];     // curso_matriculas + dados agregados de progresso
let matriculaDetalheAtual = null;

function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function showLoginAlert(msg, tipo){
  var el = document.getElementById('login-alert');
  el.textContent = msg;
  el.className = 'alert-box ' + tipo;
}
function mostrarTela(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
function mostrarRecuperarSenha(){
  document.getElementById('recuperar-email').value = document.getElementById('login-email').value || '';
  document.getElementById('recuperar-alert').className = 'alert-box';
  mostrarTela('screen-recuperar');
}
function voltarParaLogin(){ mostrarTela('screen-login'); }
async function enviarRecuperarSenha(){
  var email = document.getElementById('recuperar-email').value.trim();
  var alertEl = document.getElementById('recuperar-alert');
  if(!email){ alertEl.textContent = 'Informe seu e-mail.'; alertEl.className = 'alert-box err'; return; }
  var btn = document.getElementById('btn-recuperar');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-inline"></span>Enviando...';
  try{
    var r = await supa.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if(r.error){
      alertEl.textContent = 'Não foi possível enviar o link agora. Tente novamente.';
      alertEl.className = 'alert-box err';
    }else{
      alertEl.textContent = 'Se esse e-mail estiver cadastrado, você vai receber um link pra criar uma nova senha.';
      alertEl.className = 'alert-box ok';
    }
  }catch(e){
    console.log('err recuperar senha', e);
    alertEl.textContent = 'Erro inesperado. Tente novamente.';
    alertEl.className = 'alert-box err';
  }
  btn.disabled = false; btn.textContent = 'Enviar link de recuperação';
}
async function salvarNovaSenha(){
  var s1 = document.getElementById('nova-senha-1').value;
  var s2 = document.getElementById('nova-senha-2').value;
  var alertEl = document.getElementById('nova-senha-alert');
  if(!s1 || s1.length < 6){ alertEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; alertEl.className = 'alert-box err'; return; }
  if(s1 !== s2){ alertEl.textContent = 'As senhas não coincidem.'; alertEl.className = 'alert-box err'; return; }
  var btn = document.getElementById('btn-nova-senha');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-inline"></span>Salvando...';
  // Watchdog: se updateUser() ou iniciarApp() travarem sem erro nem sucesso
  // (visto em teste real — senha salvava mas a tela ficava presa em
  // "Salvando..." quando a conta não tinha curso_alunos vinculado e o
  // feedback ia pro lugar errado), libera o botão com mensagem em vez de
  // ficar preso pra sempre.
  var tempoEsgotado = false;
  var watchdog = setTimeout(function(){
    tempoEsgotado = true;
    alertEl.textContent = 'Isso está demorando mais que o esperado. Se sua senha já foi salva, tente entrar normalmente; senão, peça um novo link de recuperação.';
    alertEl.className = 'alert-box err';
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
  }, 8000);
  try{
    var r = await supa.auth.updateUser({ password: s1, data: { must_change_password: false } });
    if(tempoEsgotado) return;
    if(r.error){
      clearTimeout(watchdog);
      alertEl.textContent = 'Não foi possível salvar a nova senha. Peça um novo link e tente de novo.';
      alertEl.className = 'alert-box err';
      btn.disabled = false; btn.textContent = 'Salvar nova senha';
      return;
    }
    await iniciarApp('nova-senha-alert');
    clearTimeout(watchdog);
  }catch(e){
    if(tempoEsgotado) return;
    clearTimeout(watchdog);
    console.log('err salvar nova senha', e);
    alertEl.textContent = 'Erro inesperado. Tente novamente.';
    alertEl.className = 'alert-box err';
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
  }
}
function toggleSenhaVisivel(id, icone){
  var inp = document.getElementById(id);
  if(!inp) return;
  if(inp.type === 'password'){ inp.type = 'text'; icone.textContent = '🙈'; }
  else { inp.type = 'password'; icone.textContent = '👁'; }
}

async function fazerLoginAluno(){
  var email = document.getElementById('login-email').value.trim();
  var senha = document.getElementById('login-senha').value;
  if(!email || !senha){ showLoginAlert('Preencha e-mail e senha.', 'err'); return; }
  var btn = document.getElementById('btn-login');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-inline"></span>Entrando...';
  try{
    var r = await supa.auth.signInWithPassword({ email: email, password: senha });
    if(r.error){
      showLoginAlert('E-mail ou senha incorretos.', 'err');
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }
    await iniciarApp();
  }catch(e){
    console.log('err login aluno', e);
    showLoginAlert('Erro inesperado. Tente novamente.', 'err');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function sairAluno(){
  await supa.auth.signOut();
  alunoAtual = null; matriculasAtuais = [];
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('login-email').value = '';
  document.getElementById('login-senha').value = '';
}

async function iniciarApp(alertElId){
  // alertElId: onde mostrar "conta não vinculada" se não houver curso_alunos —
  // precisa ser configurável porque essa função é chamada tanto do login
  // normal (tela com #login-alert) quanto de salvarNovaSenha() (tela com
  // #nova-senha-alert); escrever sempre em #login-alert deixava a tela de
  // nova senha "presa" sem nenhum feedback quando a conta não tinha vínculo.
  var idAlvo = alertElId || 'login-alert';
  try{
    var rAluno = await supa.from('curso_alunos').select('*');
    if(rAluno.error || !rAluno.data || !rAluno.data.length){
      var elAlvo = document.getElementById(idAlvo);
      if(elAlvo){ elAlvo.textContent = 'Esta conta não está vinculada a nenhum cadastro de aluno. Fale com a escola.'; elAlvo.className = 'alert-box err'; }
      await supa.auth.signOut();
      var btnLogin = document.getElementById('btn-login');
      if(btnLogin){ btnLogin.disabled = false; btnLogin.textContent = 'Entrar'; }
      var btnNovaSenha = document.getElementById('btn-nova-senha');
      if(btnNovaSenha){ btnNovaSenha.disabled = false; btnNovaSenha.textContent = 'Salvar nova senha'; }
      return false;
    }
    alunoAtual = rAluno.data[0];
    // Primeiro acesso com senha provisória (criada pelo admin via WhatsApp,
    // sem convite por e-mail) — obriga trocar antes de entrar no Portal.
    // Reaproveita a mesma tela/fluxo de "esqueci minha senha", já que
    // supa.auth.updateUser() funciona igual em qualquer sessão autenticada.
    var sessaoAtual = await supa.auth.getSession();
    var metadados = sessaoAtual.data && sessaoAtual.data.session && sessaoAtual.data.session.user
      ? sessaoAtual.data.session.user.user_metadata : null;
    if(metadados && metadados.must_change_password){
      var elAviso = document.getElementById('nova-senha-alert');
      if(elAviso){ elAviso.textContent = 'Primeiro acesso — defina sua senha definitiva pra continuar.'; elAviso.className = 'alert-box ok'; }
      mostrarTela('screen-nova-senha');
      return true;
    }
    mostrarTela('screen-app');
    document.getElementById('saudacao-aluno').textContent = 'Olá, ' + (alunoAtual.nome || 'aluna') + '! 🌷';
    await carregarMeusCursos();
    carregarAvisos();
    return true;
  }catch(e){
    console.log('err iniciar app aluno', e);
    return false;
  }
}

function mostrarView(view){
  ['cursos','curso-detalhe','turma','certificados','avisos'].forEach(function(v){
    var el = document.getElementById('view-' + v);
    if(el) el.style.display = (v === view) ? 'block' : 'none';
  });
  ['cursos','turma','certificados','avisos'].forEach(function(v){
    var b = document.getElementById('nav-' + v);
    if(b) b.classList.toggle('active', v === view);
  });
  var titulos = { cursos: 'Meus Cursos', turma: 'Minha Turma', certificados: 'Certificados', avisos: 'Avisos' };
  if(titulos[view]) document.getElementById('topbar-titulo').textContent = titulos[view];
  if(view === 'turma') carregarMinhaTurma();
  if(view === 'certificados') carregarCertificados();
  if(view === 'avisos') carregarAvisos();
}

// ===== Meus Cursos =====
async function carregarMeusCursos(){
  var wrap = document.getElementById('lista-cursos-aluno');
  try{
    var rMat = await supa.from('curso_matriculas').select('*').in('status', ['matriculado','andamento','concluido']);
    matriculasAtuais = rMat.data || [];
    if(!matriculasAtuais.length){ wrap.innerHTML = '<div class="empty-state">Nenhum curso matriculado ainda.</div>'; return; }

    var cursoIds = matriculasAtuais.filter(function(m){return m.curso_id;}).map(function(m){return m.curso_id;});
    var comboIds = matriculasAtuais.filter(function(m){return m.combo_id;}).map(function(m){return m.combo_id;});
    var cursosPorId = {}, combosPorId = {}, itensComboPorCombo = {};
    if(cursoIds.length){
      var rC = await supa.from('cursos').select('*').in('id', cursoIds);
      (rC.data||[]).forEach(function(c){ cursosPorId[c.id] = c; });
    }
    if(comboIds.length){
      var rCo = await supa.from('curso_combos').select('*').in('id', comboIds);
      (rCo.data||[]).forEach(function(c){ combosPorId[c.id] = c; });
      var rItens = await supa.from('curso_combo_itens').select('*').in('combo_id', comboIds);
      (rItens.data||[]).forEach(function(it){
        if(!itensComboPorCombo[it.combo_id]) itensComboPorCombo[it.combo_id] = [];
        itensComboPorCombo[it.combo_id].push(it.curso_id);
      });
      var todosCursosDeCombo = Object.values(itensComboPorCombo).flat();
      if(todosCursosDeCombo.length){
        var rCsub = await supa.from('cursos').select('*').in('id', todosCursosDeCombo);
        (rCsub.data||[]).forEach(function(c){ cursosPorId[c.id] = c; });
      }
    }

    for(var i=0;i<matriculasAtuais.length;i++){
      var m = matriculasAtuais[i];
      var cursoIdsDaMatricula = m.curso_id ? [m.curso_id] : (itensComboPorCombo[m.combo_id] || []);
      var prog = await calcularProgresso(m.id, cursoIdsDaMatricula);
      m._nome = m.curso_id ? (cursosPorId[m.curso_id]||{}).nome : (combosPorId[m.combo_id]||{}).nome;
      m._capa = m.curso_id ? (cursosPorId[m.curso_id]||{}).capa_url : (combosPorId[m.combo_id]||{}).capa_url;
      m._cursoIds = cursoIdsDaMatricula;
      m._progresso = prog;
    }
    renderMeusCursos();
  }catch(e){
    console.log('err carregar meus cursos', e);
    wrap.innerHTML = '<div class="empty-state">Não foi possível carregar seus cursos agora.</div>';
  }
}
async function calcularProgresso(matriculaId, cursoIds){
  if(!cursoIds || !cursoIds.length) return 0;
  try{
    var hoje = new Date().toISOString().slice(0,10);
    var rAulas = await supa.from('curso_aulas').select('id', { count: 'exact', head: true }).in('curso_id', cursoIds).or('liberar_em.is.null,liberar_em.lte.'+hoje);
    var rMats = await supa.from('curso_materiais').select('id', { count: 'exact', head: true }).in('curso_id', cursoIds).or('liberar_em.is.null,liberar_em.lte.'+hoje);
    var total = (rAulas.count||0) + (rMats.count||0);
    if(total === 0) return 0;
    var rConcl = await supa.from('curso_progresso_conteudo').select('id', { count: 'exact', head: true }).eq('matricula_id', matriculaId).eq('status', 'concluido');
    return Math.round(((rConcl.count||0) / total) * 100);
  }catch(e){ console.log('err calcular progresso', e); return 0; }
}
function matriculaStatusBadgeAluno(status){
  var map = { matriculado:'badge-green', andamento:'badge-green', concluido:'badge-blue', pagamento_pendente:'badge-yellow' };
  var label = { matriculado:'Matriculado', andamento:'Em andamento', concluido:'Concluído', pagamento_pendente:'Pagamento pendente' };
  return '<span class="badge ' + (map[status]||'badge-gray') + '">' + (label[status]||status) + '</span>';
}
function renderMeusCursos(){
  var wrap = document.getElementById('lista-cursos-aluno');
  if(!matriculasAtuais.length){ wrap.innerHTML = '<div class="empty-state">Nenhum curso matriculado ainda.</div>'; return; }
  wrap.innerHTML = matriculasAtuais.map(function(m){
    var capa = m._capa ? ('<img class="curso-card-capa" src="'+m._capa+'"/>') : '<div class="curso-card-capa">🎓</div>';
    return '<div class="curso-card" onclick="abrirCursoDetalhe(\''+m.id+'\')">'
      + '<div class="curso-card-top">' + capa
      + '<div style="flex:1"><div class="curso-card-nome">' + escHtml(m._nome||'Curso') + '</div>'
      + '<div class="curso-card-status">' + matriculaStatusBadgeAluno(m.status) + '</div></div>'
      + '</div>'
      + '<div class="progress-track"><div class="progress-fill" style="width:' + m._progresso + '%"></div></div>'
      + '<div class="progress-label">Progresso: ' + m._progresso + '%</div>'
      + '</div>';
  }).join('');
}

// ===== Detalhe do curso: módulos, aulas, materiais =====
async function abrirCursoDetalhe(matriculaId){
  var m = matriculasAtuais.find(function(x){return x.id === matriculaId;});
  if(!m) return;
  matriculaDetalheAtual = m;
  mostrarView('curso-detalhe');
  document.getElementById('topbar-titulo').textContent = m._nome || 'Curso';
  var corpo = document.getElementById('curso-detalhe-corpo');
  corpo.innerHTML = '<div class="empty-state">Carregando...</div>';
  try{
    var cursoIds = m._cursoIds;
    var rMod = await supa.from('curso_modulos').select('*').in('curso_id', cursoIds).order('ordem');
    var rAulas = await supa.from('curso_aulas').select('*').in('curso_id', cursoIds).order('ordem');
    var rMats = await supa.from('curso_materiais').select('*').in('curso_id', cursoIds).order('ordem');
    var rEx = await supa.from('curso_exercicios').select('*').in('curso_id', cursoIds).order('ordem');
    var rProvas = await supa.from('curso_provas').select('*').in('curso_id', cursoIds).eq('ativo', true).order('ordem');
    var rProg = await supa.from('curso_progresso_conteudo').select('*').eq('matricula_id', matriculaId);
    var rEnvios = await supa.from('curso_exercicio_envios').select('*').eq('matricula_id', matriculaId).order('criado_em', { ascending:false });
    var rTentativas = await supa.from('curso_prova_tentativas').select('*').eq('matricula_id', matriculaId).order('numero_tentativa', { ascending:false });
    var progressoPorItem = {};
    (rProg.data||[]).forEach(function(p){
      var chave = (p.aula_id ? 'aula:'+p.aula_id : 'material:'+p.material_id);
      progressoPorItem[chave] = p;
    });
    window._exerciciosCache = rEx.data || [];
    window._provasCache = rProvas.data || [];
    window._enviosCache = rEnvios.data || [];
    window._tentativasCache = rTentativas.data || [];
    renderCursoDetalhe(rMod.data||[], rAulas.data||[], rMats.data||[], progressoPorItem);
  }catch(e){
    console.log('err abrir curso detalhe', e);
    corpo.innerHTML = '<div class="empty-state">Não foi possível carregar o conteúdo.</div>';
  }
}
function envioAtualDoExercicio(exercicioId){
  return (window._enviosCache||[]).find(function(e){ return e.exercicio_id === exercicioId; }) || null;
}
function tentativasDaProva(provaId){
  return (window._tentativasCache||[]).filter(function(t){ return t.prova_id === provaId; });
}
function envioStatusBadge(status){
  var map = { enviado:'Enviado — aguardando correção', em_analise:'Em análise', aprovado:'Aprovado ✅', refazer:'Precisa refazer 🔁' };
  return map[status] || status;
}
function itemAindaBloqueado(liberarEm){
  if(!liberarEm) return false;
  return liberarEm > new Date().toISOString().slice(0,10);
}
function renderCursoDetalhe(modulos, aulas, materiais, progressoPorItem){
  var corpo = document.getElementById('curso-detalhe-corpo');
  if(!modulos.length){ corpo.innerHTML = '<div class="empty-state">Conteúdo ainda não publicado.</div>'; return; }
  corpo.innerHTML = modulos.map(function(mod){
    var aulasDoModulo = aulas.filter(function(a){return a.modulo_id === mod.id;});
    var matsDoModulo = materiais.filter(function(mt){return mt.modulo_id === mod.id;});
    var aulasHtml = aulasDoModulo.map(function(a){
      var prog = progressoPorItem['aula:'+a.id];
      var feito = prog && prog.status === 'concluido';
      var bloqueado = itemAindaBloqueado(a.liberar_em);
      return '<div class="item-row" style="' + (bloqueado?'opacity:.5;cursor:default':'') + '" onclick="' + (bloqueado?'alertConteudoBloqueado(\''+a.liberar_em+'\')':'abrirAulaViewer(\''+a.id+'\')') + '">'
        + '<span class="item-icon">' + (bloqueado?'🔒':(a.tipo_conteudo==='video'?'🎥':'📄')) + '</span>'
        + '<span style="flex:1">' + escHtml(a.titulo) + (a.duracao_min?' <span style="color:#aaa;font-size:11px">('+a.duracao_min+' min)</span>':'') + (bloqueado?' <span style="color:#aaa;font-size:11px">— libera '+fmtDataBRAluno(a.liberar_em)+'</span>':'') + '</span>'
        + '<span class="item-check">' + (feito?'✅':'') + '</span>'
        + '</div>';
    }).join('');
    var matsHtml = matsDoModulo.map(function(mt){
      var prog = progressoPorItem['material:'+mt.id];
      var feito = prog && prog.status === 'concluido';
      var bloqueado = itemAindaBloqueado(mt.liberar_em);
      return '<div class="item-row" style="' + (bloqueado?'opacity:.5;cursor:default':'') + '" onclick="' + (bloqueado?'alertConteudoBloqueado(\''+mt.liberar_em+'\')':'abrirMaterialViewer(\''+mt.id+'\')') + '">'
        + '<span class="item-icon">' + (bloqueado?'🔒':'📎') + '</span>'
        + '<span style="flex:1">' + escHtml(mt.nome) + (bloqueado?' <span style="color:#aaa;font-size:11px">— libera '+fmtDataBRAluno(mt.liberar_em)+'</span>':'') + '</span>'
        + '<span class="item-check">' + (feito?'✅':'') + '</span>'
        + '</div>';
    }).join('');
    var exDoModulo = (window._exerciciosCache||[]).filter(function(e){ return e.modulo_id === mod.id; });
    var provasDoModulo = (window._provasCache||[]).filter(function(p){ return p.modulo_id === mod.id; });
    var exHtml = exDoModulo.map(function(e){
      var envio = envioAtualDoExercicio(e.id);
      var statusTxt = envio ? envioStatusBadge(envio.status) : '';
      return '<div class="item-row" onclick="abrirExercicio(\''+e.id+'\')">'
        + '<span class="item-icon">📝</span>'
        + '<span style="flex:1">' + escHtml(e.titulo) + (statusTxt?' <span style="color:#888;font-size:11px">— '+statusTxt+'</span>':'') + '</span>'
        + '<span class="item-check">' + (envio && envio.status==='aprovado' ? '✅' : '') + '</span>'
        + '</div>';
    }).join('');
    var provasHtml = provasDoModulo.map(function(p){
      var tentativas = tentativasDaProva(p.id);
      var melhor = tentativas.reduce(function(acc,t){ return (acc===null || (t.percentual||0) > acc) ? (t.percentual||0) : acc; }, null);
      var info = tentativas.length ? (' — melhor nota: '+Math.round(melhor)+'%') : '';
      return '<div class="item-row" onclick="abrirProva(\''+p.id+'\')">'
        + '<span class="item-icon">🧪</span>'
        + '<span style="flex:1">' + escHtml(p.titulo) + info + '</span>'
        + '<span class="item-check">' + (tentativas.some(function(t){return t.aprovado;}) ? '✅' : '') + '</span>'
        + '</div>';
    }).join('');
    return '<div class="modulo-block"><div class="modulo-head">' + escHtml(mod.nome) + '</div>' + aulasHtml + matsHtml + exHtml + provasHtml + '</div>';
  }).join('');
  window._aulasCache = aulas; window._materiaisCache = materiais;
}
function fmtDataBRAluno(iso){
  if(!iso) return '';
  var p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function alertConteudoBloqueado(liberarEm){
  alert('Este conteúdo ainda não foi liberado. Disponível a partir de ' + fmtDataBRAluno(liberarEm) + '.');
}
function fecharViewer(){ document.getElementById('item-viewer').classList.remove('open'); }
async function abrirAulaViewer(aulaId){
  var a = (window._aulasCache||[]).find(function(x){return x.id === aulaId;});
  if(!a) return;
  document.getElementById('item-viewer-titulo').textContent = a.titulo;
  var body = document.getElementById('item-viewer-body');
  var html = '';
  if(a.video_url) html += '<video controls style="width:100%;border-radius:10px;margin-bottom:14px" src="' + a.video_url + '"></video>';
  if(a.texto_conteudo) html += '<div style="font-size:14px;line-height:1.7;white-space:pre-wrap">' + escHtml(a.texto_conteudo) + '</div>';
  if(!html) html = '<div class="empty-state">Sem conteúdo cadastrado ainda.</div>';
  html += '<button class="btn-main" style="margin-top:20px" onclick="marcarConcluido(\'aula\',\''+aulaId+'\')">✅ Marcar como concluída</button>';
  body.innerHTML = html;
  document.getElementById('item-viewer').classList.add('open');
  registrarAberturaConteudo('aula', aulaId);
}
async function abrirMaterialViewer(materialId){
  var mt = (window._materiaisCache||[]).find(function(x){return x.id === materialId;});
  if(!mt) return;
  document.getElementById('item-viewer-titulo').textContent = mt.nome;
  var body = document.getElementById('item-viewer-body');
  body.innerHTML = '<div class="empty-state">Carregando...</div>';
  document.getElementById('item-viewer').classList.add('open');
  var html = '';
  if(mt.arquivo_url){
    // curso-materiais é bucket privado — arquivo_url guarda só o path bruto
    // do Storage, não uma URL utilizável. Link assinado gerado na hora,
    // válido por 1h (tempo de sobra pra ler o PDF na tela).
    try{
      var signed = await supa.storage.from('curso-materiais').createSignedUrl(mt.arquivo_url, 3600);
      if(signed.error || !signed.data) throw signed.error || new Error('sem signed url');
      var url = signed.data.signedUrl;
      html += '<iframe src="' + url + '" style="width:100%;height:60vh;margin-bottom:14px"></iframe>';
      if(mt.permite_download) html += '<a href="' + url + '" download target="_blank" class="btn-outline" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">⬇️ Baixar</a>';
    }catch(e){
      console.log('err gerar link material aluno', e);
      html = '<div class="empty-state">Não foi possível carregar o arquivo agora.</div>';
    }
  } else {
    html = '<div class="empty-state">Arquivo não disponível.</div>';
  }
  html += '<button class="btn-main" onclick="marcarConcluido(\'material\',\''+materialId+'\')">✅ Marcar como concluído</button>';
  body.innerHTML = html;
  registrarAberturaConteudo('material', materialId);
}
async function registrarAberturaConteudo(tipo, id){
  try{
    var matriculaId = matriculaDetalheAtual.id;
    var campo = tipo === 'aula' ? 'aula_id' : 'material_id';
    var existente = await supa.from('curso_progresso_conteudo').select('id,status').eq('matricula_id', matriculaId).eq(campo, id).maybeSingle();
    if(!existente.data){
      await supa.from('curso_progresso_conteudo').insert([{
        matricula_id: matriculaId, salao_id: alunoAtual.salao_id, tipo_conteudo: tipo,
        aula_id: tipo==='aula'?id:null, material_id: tipo==='material'?id:null,
        status: 'em_andamento', aberto_em: new Date().toISOString()
      }]);
    }
  }catch(e){ console.log('err registrar abertura', e); }
}
async function marcarConcluido(tipo, id){
  try{
    var matriculaId = matriculaDetalheAtual.id;
    var campo = tipo === 'aula' ? 'aula_id' : 'material_id';
    var existente = await supa.from('curso_progresso_conteudo').select('id').eq('matricula_id', matriculaId).eq(campo, id).maybeSingle();
    if(existente.data){
      await supa.from('curso_progresso_conteudo').update({ status: 'concluido', concluido_em: new Date().toISOString() }).eq('id', existente.data.id);
    } else {
      await supa.from('curso_progresso_conteudo').insert([{
        matricula_id: matriculaId, salao_id: alunoAtual.salao_id, tipo_conteudo: tipo,
        aula_id: tipo==='aula'?id:null, material_id: tipo==='material'?id:null,
        status: 'concluido', aberto_em: new Date().toISOString(), concluido_em: new Date().toISOString()
      }]);
    }
    fecharViewer();
    abrirCursoDetalhe(matriculaId);
  }catch(e){ console.log('err marcar concluido', e); }
}

// ===== Exercícios =====
function opcaoTexto(exercicio, optId){
  var o = (exercicio.opcoes||[]).find(function(x){return x.id === optId;});
  return o ? o.texto : optId;
}
function abrirExercicio(exercicioId){
  var e = (window._exerciciosCache||[]).find(function(x){return x.id === exercicioId;});
  if(!e) return;
  document.getElementById('item-viewer-titulo').textContent = e.titulo;
  var body = document.getElementById('item-viewer-body');
  var envio = envioAtualDoExercicio(exercicioId);
  var html = '<div style="font-size:14px;margin-bottom:16px;white-space:pre-wrap">' + escHtml(e.enunciado||'') + '</div>';
  if(envio && envio.status !== 'refazer'){
    html += '<div style="background:var(--gray-50);border-radius:10px;padding:12px 14px;font-size:13px">'
      + '<div style="font-weight:700;margin-bottom:6px">' + envioStatusBadge(envio.status) + '</div>'
      + (envio.resposta_texto ? '<div style="white-space:pre-wrap">'+escHtml(envio.resposta_texto)+'</div>' : '')
      + (envio.resposta_opcao ? '<div>Resposta: '+escHtml(opcaoTexto(e, envio.resposta_opcao))+'</div>' : '')
      + (envio.arquivo_url ? '<div>📎 arquivo enviado</div>' : '')
      + (envio.comentario_professor ? '<div style="margin-top:8px;color:#555"><b>Comentário:</b> '+escHtml(envio.comentario_professor)+'</div>' : '')
      + '</div>';
    body.innerHTML = html;
  }else{
    if(envio && envio.status === 'refazer' && envio.comentario_professor){
      html += '<div style="background:#fef2f2;border-radius:10px;padding:10px 14px;font-size:13px;color:#b91c1c;margin-bottom:14px"><b>O professor pediu pra refazer:</b> '+escHtml(envio.comentario_professor)+'</div>';
    }
    if(e.tipo === 'texto'){
      html += '<textarea id="exec-resposta-texto" style="width:100%;min-height:100px;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px"></textarea>';
    }else if(e.tipo === 'multipla_escolha' || e.tipo === 'verdadeiro_falso'){
      html += (e.opcoes||[]).map(function(o){
        return '<label style="display:flex;align-items:center;gap:8px;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer">'
          + '<input type="radio" name="exec-opcao" value="'+o.id+'"/> ' + escHtml(o.texto) + '</label>';
      }).join('');
    }else if(e.tipo === 'envio_imagem'){
      html += '<input type="file" id="exec-arquivo" accept="image/jpeg,image/png,image/webp"/>';
    }else if(e.tipo === 'envio_arquivo'){
      html += '<input type="file" id="exec-arquivo" accept="application/pdf"/>';
    }
    html += '<button class="btn-main" style="margin-top:16px" onclick="enviarExercicio(\''+exercicioId+'\')">Enviar resposta</button>';
    body.innerHTML = html;
  }
  document.getElementById('item-viewer').classList.add('open');
}
async function enviarExercicio(exercicioId){
  var e = (window._exerciciosCache||[]).find(function(x){return x.id === exercicioId;});
  if(!e) return;
  var payload = { exercicio_id: exercicioId, matricula_id: matriculaDetalheAtual.id, salao_id: alunoAtual.salao_id, status: 'enviado' };
  if(e.tipo === 'texto'){
    var texto = document.getElementById('exec-resposta-texto').value.trim();
    if(!texto){ alert('Escreva sua resposta antes de enviar.'); return; }
    payload.resposta_texto = texto;
  }else if(e.tipo === 'multipla_escolha' || e.tipo === 'verdadeiro_falso'){
    var sel = document.querySelector('input[name="exec-opcao"]:checked');
    if(!sel){ alert('Selecione uma opção.'); return; }
    payload.resposta_opcao = sel.value;
  }else{
    var fileInput = document.getElementById('exec-arquivo');
    var file = fileInput.files[0];
    if(!file){ alert('Selecione um arquivo.'); return; }
    try{
      var path = alunoAtual.salao_id + '/' + alunoAtual.id + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
      var up = await supa.storage.from('curso-envios').upload(path, file);
      if(up.error) throw up.error;
      payload.arquivo_url = path;
    }catch(err){ console.log('err upload exercicio', err); alert('Não foi possível enviar o arquivo (verifique o tipo e tamanho — só imagem ou PDF, até 10MB).'); return; }
  }
  try{
    var r = await supa.from('curso_exercicio_envios').insert([payload]).select('*').single();
    if(r.error) throw r.error;
    window._enviosCache = (window._enviosCache||[]).filter(function(x){return x.exercicio_id !== exercicioId;}).concat([r.data]);
  }catch(err){ console.log('err enviar exercicio', err); alert('Não foi possível enviar. Tente novamente.'); return; }
  fecharViewer();
  abrirCursoDetalhe(matriculaDetalheAtual.id);
}

// ===== Provas =====
var provaEmAndamento = null; // {prova, perguntas, respostas:{perguntaId:valor}}
async function abrirProva(provaId){
  var p = (window._provasCache||[]).find(function(x){return x.id === provaId;});
  if(!p) return;
  var tentativas = tentativasDaProva(provaId);
  document.getElementById('item-viewer-titulo').textContent = p.titulo;
  var body = document.getElementById('item-viewer-body');
  var usadas = tentativas.length;
  var podeTentar = usadas < p.tentativas_maximas;
  var html = '<div style="font-size:13.5px;color:var(--gray-600);margin-bottom:12px">' + escHtml(p.descricao||'') + '</div>';
  html += '<div style="font-size:12.5px;color:var(--gray-600);margin-bottom:16px">Nota mínima: '+p.nota_minima+'% · Tentativas: '+usadas+'/'+p.tentativas_maximas+(p.tempo_limite_min?' · Tempo limite: '+p.tempo_limite_min+' min':'')+'</div>';
  if(tentativas.length){
    html += tentativas.map(function(t){
      return '<div style="background:var(--gray-50);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12.5px;display:flex;justify-content:space-between"><span>Tentativa '+t.numero_tentativa+'</span><span>'+Math.round(t.percentual||0)+'% '+(t.aprovado?'✅':'')+'</span></div>';
    }).join('');
  }
  if(podeTentar){
    html += '<button class="btn-main" style="margin-top:12px" onclick="iniciarProva(\''+provaId+'\')">'+(tentativas.length?'Tentar novamente':'Iniciar prova')+'</button>';
  }else{
    html += '<div style="margin-top:12px;color:var(--gray-400);font-size:12.5px">Você já usou todas as tentativas disponíveis.</div>';
  }
  body.innerHTML = html;
  document.getElementById('item-viewer').classList.add('open');
}
async function iniciarProva(provaId){
  var p = (window._provasCache||[]).find(function(x){return x.id === provaId;});
  if(!p) return;
  try{
    var r = await supa.from('curso_prova_perguntas').select('*').eq('prova_id', provaId).order('ordem');
    var perguntas = r.data || [];
    if(!perguntas.length){ alert('Esta prova ainda não tem perguntas cadastradas.'); return; }
    provaEmAndamento = { prova: p, perguntas: perguntas, respostas: {} };
    renderPerguntaAtualProva(0);
  }catch(e){ console.log('err iniciar prova', e); alert('Não foi possível carregar a prova.'); }
}
function renderPerguntaAtualProva(idx){
  var pa = provaEmAndamento;
  if(!pa) return;
  var pg = pa.perguntas[idx];
  var body = document.getElementById('item-viewer-body');
  if(!pg){ finalizarProva(); return; }
  var respostaAtual = pa.respostas[pg.id];
  var html = '<div style="font-size:12px;color:var(--gray-400);margin-bottom:6px">Pergunta '+(idx+1)+' de '+pa.perguntas.length+'</div>';
  html += '<div style="font-size:14px;font-weight:700;margin-bottom:14px">'+escHtml(pg.enunciado)+'</div>';
  html += (pg.opcoes||[]).map(function(o){
    return '<label style="display:flex;align-items:center;gap:8px;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer">'
      + '<input type="radio" name="pg-opcao" value="'+o.id+'" '+(respostaAtual===o.id?'checked':'')+' onchange="provaEmAndamento.respostas[\''+pg.id+'\']=this.value"/> ' + escHtml(o.texto) + '</label>';
  }).join('');
  html += '<button class="btn-main" style="margin-top:12px" onclick="proximaPerguntaProva('+idx+')">'+(idx+1<pa.perguntas.length?'Próxima':'Finalizar e ver resultado')+'</button>';
  body.innerHTML = html;
}
function proximaPerguntaProva(idxAtual){
  var pa = provaEmAndamento;
  var pg = pa.perguntas[idxAtual];
  if(!pa.respostas[pg.id]){ alert('Selecione uma resposta antes de continuar.'); return; }
  renderPerguntaAtualProva(idxAtual+1);
}
async function finalizarProva(){
  var pa = provaEmAndamento;
  if(!pa) return;
  var pontuacaoMaxima = 0, pontuacaoObtida = 0;
  var respostasSalvas = pa.perguntas.map(function(pg){
    var resp = pa.respostas[pg.id];
    pontuacaoMaxima += Number(pg.pontuacao)||0;
    var correta = resp === pg.resposta_correta;
    if(correta) pontuacaoObtida += Number(pg.pontuacao)||0;
    return { pergunta_id: pg.id, resposta: resp, correta: correta };
  });
  var percentual = pontuacaoMaxima > 0 ? (pontuacaoObtida/pontuacaoMaxima*100) : 0;
  var aprovado = percentual >= (pa.prova.nota_minima||0);
  var numeroTentativa = tentativasDaProva(pa.prova.id).length + 1;
  try{
    var r = await supa.from('curso_prova_tentativas').insert([{
      prova_id: pa.prova.id, matricula_id: matriculaDetalheAtual.id, salao_id: alunoAtual.salao_id,
      numero_tentativa: numeroTentativa, respostas: respostasSalvas,
      pontuacao_obtida: pontuacaoObtida, pontuacao_maxima: pontuacaoMaxima, percentual: percentual,
      aprovado: aprovado, finalizado_em: new Date().toISOString()
    }]).select('*').single();
    if(r.error) throw r.error;
    window._tentativasCache = (window._tentativasCache||[]).concat([r.data]);
  }catch(e){ console.log('err finalizar prova', e); alert('Não foi possível registrar sua tentativa.'); return; }
  var body = document.getElementById('item-viewer-body');
  body.innerHTML = '<div style="text-align:center;padding:20px 0">'
    + '<div style="font-size:40px">'+(aprovado?'🎉':'😕')+'</div>'
    + '<div style="font-size:22px;font-weight:800;margin-top:10px">'+Math.round(percentual)+'%</div>'
    + '<div style="font-size:13px;color:var(--gray-600);margin-top:6px">'+(aprovado?'Aprovado!':'Não atingiu a nota mínima de '+pa.prova.nota_minima+'%')+'</div>'
    + '<button class="btn-main" style="margin-top:20px" onclick="fecharViewer();abrirCursoDetalhe(matriculaDetalheAtual.id)">Voltar ao curso</button>'
    + '</div>';
  provaEmAndamento = null;
}

// ===== Minha Turma =====
async function carregarMinhaTurma(){
  var wrap = document.getElementById('turma-aluno-corpo');
  wrap.innerHTML = '<div class="empty-state">Carregando...</div>';
  try{
    var comTurma = matriculasAtuais.filter(function(m){return m.turma_id;});
    if(!comTurma.length){ wrap.innerHTML = '<div class="empty-state">Você ainda não está em nenhuma turma.</div>'; return; }
    var turmaIds = comTurma.map(function(m){return m.turma_id;});
    var rT = await supa.from('curso_turmas').select('*').in('id', turmaIds);
    var turmas = rT.data || [];
    var rTA = await supa.from('curso_turma_aulas').select('*').in('turma_id', turmaIds).order('data');
    var aulasPorTurma = {};
    (rTA.data||[]).forEach(function(ta){
      if(!aulasPorTurma[ta.turma_id]) aulasPorTurma[ta.turma_id] = [];
      aulasPorTurma[ta.turma_id].push(ta);
    });
    wrap.innerHTML = turmas.map(function(t){
      var aulasDaTurma = aulasPorTurma[t.id] || [];
      var datasHtml = aulasDaTurma.map(function(ta){
        var p = ta.data.split('-');
        var badge = ta.status === 'realizada' ? '<span class="badge badge-green">Realizada</span>' : '<span class="badge badge-gray">Agendada</span>';
        return '<div class="item-row" style="cursor:default"><span style="flex:1">' + p[2]+'/'+p[1] + '</span>' + badge + '</div>';
      }).join('');
      return '<div class="modulo-block"><div class="modulo-head">' + escHtml(t.nome)
        + '<div style="font-weight:400;font-size:12px;color:#888;margin-top:2px">' + (t.local?escHtml(t.local)+' · ':'') + (t.hora_inicio||'').substring(0,5) + '–' + (t.hora_fim||'').substring(0,5) + '</div></div>'
        + datasHtml + '</div>';
    }).join('');
  }catch(e){
    console.log('err carregar minha turma', e);
    wrap.innerHTML = '<div class="empty-state">Não foi possível carregar sua turma.</div>';
  }
}

// ===== Certificados =====
function certificadoStatusBadge(status){
  var map = { liberado:'badge-green', emitido:'badge-blue', revogado:'badge-gray' };
  var label = { liberado:'Disponível', emitido:'Emitido', revogado:'Indisponível' };
  return '<span class="badge ' + (map[status]||'badge-gray') + '">' + (label[status]||status) + '</span>';
}
async function carregarCertificados(){
  var wrap = document.getElementById('certificados-aluno-corpo');
  wrap.innerHTML = '<div class="empty-state">Carregando...</div>';
  try{
    var matriculaIds = matriculasAtuais.map(function(m){ return m.id; });
    if(!matriculaIds.length){ wrap.innerHTML = '<div class="empty-state">Nenhum certificado disponível ainda.</div>'; return; }
    var r = await supa.from('curso_certificados').select('*').in('matricula_id', matriculaIds).neq('status', 'revogado').order('emitido_em', { ascending:false });
    var certificados = r.data || [];
    if(!certificados.length){ wrap.innerHTML = '<div class="empty-state">Nenhum certificado disponível ainda. Ele aparece aqui quando a escola liberar.</div>'; return; }
    wrap.innerHTML = certificados.map(function(c){
      var m = matriculasAtuais.find(function(x){ return x.id === c.matricula_id; });
      var nome = m ? m._nome : 'Curso';
      return '<div class="curso-card" style="cursor:default">'
        + '<div class="curso-card-top">'
        + '<div class="curso-card-capa">🎓</div>'
        + '<div style="flex:1"><div class="curso-card-nome">' + escHtml(nome||'Curso') + '</div>'
        + '<div class="curso-card-status">' + certificadoStatusBadge(c.status) + ' · nº ' + escHtml(c.numero_certificado) + '</div></div>'
        + '</div>'
        + (c.pdf_url
            ? '<button class="btn-outline" style="display:block;width:100%;margin-top:10px" onclick="baixarCertificado(\'' + c.pdf_url + '\')">⬇️ Baixar certificado</button>'
            : '<div style="font-size:12px;color:var(--gray-600);margin-top:8px">Liberado — o PDF ainda não foi gerado pela escola.</div>')
        + '</div>';
    }).join('');
  }catch(e){
    console.log('err carregar certificados', e);
    wrap.innerHTML = '<div class="empty-state">Não foi possível carregar seus certificados agora.</div>';
  }
}
async function baixarCertificado(path){
  try{
    var r = await supa.storage.from('curso-certificados').createSignedUrl(path, 120);
    if(r.error) throw r.error;
    window.open(r.data.signedUrl, '_blank');
  }catch(e){ console.log('err baixar certificado', e); alert('Não foi possível baixar o certificado agora.'); }
}

// ===== Avisos =====
var avisosAtuais = [];
function avisoIcone(tipo){
  var map = { aula_amanha:'📅', alteracao_horario:'⏰', nova_apostila:'📎', live_evento:'🔴', exercicio_corrigido:'📝', aprovado_prova:'✅', certificado_disponivel:'🎓' };
  return map[tipo] || '🔔';
}
async function carregarAvisos(){
  var wrap = document.getElementById('avisos-aluno-corpo');
  wrap.innerHTML = '<div class="empty-state">Carregando...</div>';
  try{
    var r = await supa.from('curso_notificacoes').select('*').eq('destinatario_tipo','aluno').order('criado_em', { ascending:false });
    avisosAtuais = r.data || [];
    renderAvisos();
    atualizarBadgeAvisos();
  }catch(e){
    console.log('err carregar avisos', e);
    wrap.innerHTML = '<div class="empty-state">Não foi possível carregar seus avisos agora.</div>';
  }
}
function renderAvisos(){
  var wrap = document.getElementById('avisos-aluno-corpo');
  if(!avisosAtuais.length){ wrap.innerHTML = '<div class="empty-state">Nenhum aviso por enquanto.</div>'; return; }
  wrap.innerHTML = avisosAtuais.map(function(n){
    var evento = n.entidade_ref && n.entidade_ref.data_evento
      ? ('<div style="font-size:12px;color:var(--gray-600);margin-top:4px">📅 ' + fmtDataBRAluno(n.entidade_ref.data_evento) + (n.entidade_ref.hora_evento ? ' às ' + n.entidade_ref.hora_evento : '') + '</div>')
      : '';
    var link = n.entidade_ref && n.entidade_ref.link
      ? ('<a href="' + n.entidade_ref.link + '" target="_blank" class="btn-outline" style="display:block;text-align:center;text-decoration:none;margin-top:8px;padding:8px">Abrir link</a>')
      : '';
    return '<div class="curso-card" style="cursor:pointer;' + (n.lida ? 'opacity:.65' : 'border-left:3px solid #7c3aed') + '" onclick="abrirAviso(\'' + n.id + '\')">'
      + '<div style="display:flex;align-items:flex-start;gap:10px">'
      + '<span style="font-size:18px">' + avisoIcone(n.tipo_evento) + '</span>'
      + '<div style="flex:1">'
      + '<div style="font-weight:700;font-size:13.5px">' + escHtml(n.titulo) + '</div>'
      + (n.mensagem ? '<div style="font-size:12.5px;color:var(--gray-600);margin-top:3px">' + escHtml(n.mensagem) + '</div>' : '')
      + evento + link
      + '<div style="font-size:10.5px;color:var(--gray-400);margin-top:6px">' + new Date(n.criado_em).toLocaleString('pt-BR') + '</div>'
      + '</div>'
      + (!n.lida ? '<span style="width:8px;height:8px;border-radius:50%;background:#7c3aed;flex-shrink:0;margin-top:4px"></span>' : '')
      + '</div></div>';
  }).join('');
}
async function abrirAviso(id){
  var n = avisosAtuais.find(function(x){ return x.id === id; });
  if(!n || n.lida) return;
  n.lida = true;
  renderAvisos();
  atualizarBadgeAvisos();
  try{ await supa.from('curso_notificacoes').update({ lida: true }).eq('id', id); }
  catch(e){ console.log('err marcar aviso lido', e); }
}
function atualizarBadgeAvisos(){
  var badge = document.getElementById('avisos-badge');
  if(!badge) return;
  var naoLidos = avisosAtuais.filter(function(n){ return !n.lida; }).length;
  if(naoLidos > 0){ badge.textContent = naoLidos > 9 ? '9+' : String(naoLidos); badge.style.display = 'block'; }
  else { badge.style.display = 'none'; }
}

// ===== Boot =====
(async function boot(){
  try{
    // Redirecionado do index.html (guard de sessão de aluno) com o token
    // pelo hash — este client usa storageKey próprio ('flora-aluno-auth'),
    // não enxerga a sessão criada no client do painel do salão sozinho.
    var hash = window.location.hash;
    var ehRecuperacao = false;
    if(hash && hash.indexOf('access_token=') >= 0){
      var params = new URLSearchParams(hash.slice(1));
      var at = params.get('access_token'), rt = params.get('refresh_token');
      ehRecuperacao = params.get('type') === 'recovery';
      if(at && rt){
        await supa.auth.setSession({ access_token: at, refresh_token: rt });
        history.replaceState(null, '', window.location.pathname);
      }
    }
    if(ehRecuperacao){
      // Veio do link de "esqueci minha senha" — exige definir senha nova
      // antes de entrar no app, em vez de logar direto com o token do e-mail.
      mostrarTela('screen-nova-senha');
      return;
    }
    var s = await supa.auth.getSession();
    if(s.data && s.data.session){ await iniciarApp(); }
  }catch(e){ console.log('err boot portal aluno', e); }
})();
</script>
