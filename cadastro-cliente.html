<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Cliente — Flora Gestão</title>
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#f5f3ff 0%,#ecfdf5 100%);display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}

.card{background:#fff;border-radius:24px;padding:36px 32px 32px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(124,58,237,.12),0 4px 16px rgba(0,0,0,.06)}

.logo-wrap{text-align:center;margin-bottom:24px}
.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#7c3aed,#059669);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.brand-name{font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#7c3aed,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.form-title{font-size:18px;font-weight:800;color:#111;text-align:center;margin-bottom:4px}
.form-sub{font-size:12px;color:#888;text-align:center;margin-bottom:22px}

.field{margin-bottom:12px}
.field-label{font-size:11px;font-weight:700;color:#555;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px}
.inp{width:100%;padding:12px 14px;border:1.5px solid #e5e5e5;border-radius:12px;font-size:14px;color:#111;outline:none;transition:.2s;font-family:inherit;background:#fafafa}
.inp:focus{border-color:#7c3aed;background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.inp::placeholder{color:#bbb}
textarea.inp{resize:vertical;min-height:70px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn-main{width:100%;padding:14px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:inherit;margin-top:6px;transition:.15s}
.btn-main:hover{background:linear-gradient(135deg,#6d28d9,#5b21b6)}
.btn-main:disabled{opacity:.6;cursor:not-allowed}

.alert{border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:14px;display:none;text-align:center}
.alert.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.alert.ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.alert.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.alert.show{display:block}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.sucesso{text-align:center;padding:12px 0}
.sucesso-icon{font-size:48px;margin-bottom:12px}

@media(max-width:480px){
  body{padding:16px;align-items:flex-start;padding-top:24px}
  .card{padding:28px 20px 24px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="card">

  <div class="logo-wrap">
    <div class="logo-icon">
      <svg width="34" height="40" viewBox="0 0 100 115" fill="none">
        <path d="M50 62 C50 62 26 53 20 30 C14 8 36 2 50 24 C64 2 86 8 80 30 C74 53 50 62 50 62Z" fill="white" opacity="0.92"/>
        <path d="M50 62 C50 62 36 49 36 30 C36 14 50 5 50 5 C50 5 64 14 64 30 C64 49 50 62 50 62Z" fill="white" opacity="0.6"/>
        <path d="M50 62 L50 102" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M50 85 C50 85 28 80 24 66 C37 66 50 77 50 85Z" fill="white"/>
        <path d="M50 77 C50 77 72 72 76 58 C63 58 50 69 50 77Z" fill="white"/>
      </svg>
    </div>
    <div class="brand-name">FLORA</div>
  </div>

  <div id="conteudo">
    <div class="form-title">Faça seu cadastro</div>
    <div class="form-sub">Leva menos de 1 minuto</div>

    <div class="alert" id="alert"></div>

    <form id="form-cadastro" onsubmit="handleSubmit(event)" novalidate>
      <div class="field">
        <label class="field-label" for="f-nome">Nome completo *</label>
        <input id="f-nome" class="inp" type="text" placeholder="Seu nome completo" autocomplete="name" required/>
      </div>
      <div class="field">
        <label class="field-label" for="f-tel">WhatsApp *</label>
        <input id="f-tel" class="inp" type="tel" placeholder="(11) 99999-9999" autocomplete="tel" required/>
      </div>
      <div class="grid2">
        <div class="field">
          <label class="field-label" for="f-cpf">CPF (opcional)</label>
          <input id="f-cpf" class="inp" type="text" placeholder="000.000.000-00"/>
        </div>
        <div class="field">
          <label class="field-label" for="f-nasc">Nascimento</label>
          <input id="f-nasc" class="inp" type="date"/>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="f-endereco">Endereço</label>
        <input id="f-endereco" class="inp" type="text" placeholder="Rua, número, bairro, cidade"/>
      </div>
      <div class="field">
        <label class="field-label" for="f-obs">Observações</label>
        <textarea id="f-obs" class="inp" placeholder="Alergias, preferências..."></textarea>
      </div>

      <button class="btn-main" type="submit" id="btn-enviar">Enviar cadastro →</button>
    </form>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://nqwzbpinhkgxfboeursu.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3picGluaGtneGZib2V1cnN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTE2MTMsImV4cCI6MjA5NTcyNzYxM30.ASni8j7rfDxjhWYrDxbwidacJaV51eDzzY7XbdGQCEk';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);

function salaoIdDaUrl(){
  var p=new URLSearchParams(location.search);
  return (p.get('s')||'').trim();
}
const SALAO_ID=salaoIdDaUrl();

function val(id){return(document.getElementById(id)||{}).value||'';}
function showAlert(msg,type){
  var el=document.getElementById('alert');
  if(!el)return;
  el.textContent=msg;
  el.className='alert '+type+' show';
}

function formatarDataBR(iso){
  if(!iso)return null;
  var p=iso.split('-');
  if(p.length!==3)return iso;
  return p[2]+'/'+p[1]+'/'+p[0];
}

async function handleSubmit(e){
  e.preventDefault();

  if(!SALAO_ID){
    showAlert('Link inválido ou incompleto. Peça um novo link para o salão.','err');
    return;
  }

  var nome=val('f-nome').trim();
  var tel=val('f-tel').trim();
  var cpf=val('f-cpf').trim();
  var nasc=val('f-nasc');
  var endereco=val('f-endereco').trim();
  var obs=val('f-obs').trim();

  if(!nome){showAlert('Informe seu nome completo.','err');document.getElementById('f-nome').focus();return;}
  if(!tel){showAlert('Informe seu WhatsApp.','err');document.getElementById('f-tel').focus();return;}

  var btn=document.getElementById('btn-enviar');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Enviando…';

  try{
    var existeSalao=await supa.rpc('salao_existe',{p_salao_id:SALAO_ID});
    if(existeSalao.error||!existeSalao.data){
      showAlert('Link inválido. Peça um novo link para o salão.','err');
      btn.disabled=false;btn.innerHTML='Enviar cadastro →';
      return;
    }

    var jaExiste=await supa.rpc('cliente_tel_existe',{p_salao_id:SALAO_ID,p_tel:tel});
    if(jaExiste.data){
      showAlert('Você já tem cadastro conosco! Em breve entraremos em contato. 💜','info');
      btn.disabled=false;btn.innerHTML='Enviar cadastro →';
      return;
    }

    var hoje=new Date();
    var dataHoje=String(hoje.getDate()).padStart(2,'0')+'/'+String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear();

    var ins=await supa.from('clientes').insert([{
      nome:nome,
      tel:tel,
      cpf:cpf||null,
      nascimento:formatarDataBR(nasc),
      endereco:endereco||null,
      observacoes:obs||null,
      ultima:dataHoje,
      salao_id:SALAO_ID
    }]);

    if(ins.error){
      showAlert('Não foi possível concluir o cadastro. Tente novamente em instantes.','err');
      btn.disabled=false;btn.innerHTML='Enviar cadastro →';
      console.error('cadastro-cliente error:',ins.error);
      return;
    }

    document.getElementById('conteudo').innerHTML=
      '<div class="sucesso">'+
        '<div class="sucesso-icon">🌷</div>'+
        '<div class="form-title">Cadastro concluído!</div>'+
        '<div class="form-sub" style="margin-bottom:0">Obrigado, '+nome.split(' ')[0]+'! Em breve entraremos em contato.</div>'+
      '</div>';

  }catch(err){
    showAlert('Erro inesperado. Tente novamente.','err');
    console.error('cadastro-cliente error:',err);
    btn.disabled=false;
    btn.innerHTML='Enviar cadastro →';
  }
}

if(!SALAO_ID){
  showAlert('Link inválido ou incompleto. Peça um novo link para o salão.','err');
}
</script>
</body>
</html>
